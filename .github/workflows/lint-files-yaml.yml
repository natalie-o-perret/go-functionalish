name: ci - lint - files - *.yml, *.yaml
on:
  push:
    branches: [ main ]
    paths: [ "**/*.yml", "**/*.yaml", ".yamllint.yml" ]
  pull_request:
    branches: [ main ]
    paths: [ "**/*.yml", "**/*.yaml", ".yamllint.yml" ]
jobs:
  yaml-lint:
    name: yaml lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: run yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint.yml
          file_or_dir: .
          strict: true
