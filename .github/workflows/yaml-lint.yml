name: yaml-lint
on:
  push:
    branches: [ main ]
    paths: [ "**/*.yml", "**/*.yaml", ".yamllint.yml" ]
  pull_request:
    branches: [ main ]
    paths: [ "**/*.yml", "**/*.yaml", ".yamllint.yml" ]
jobs:
  lint-yaml:
    name: lint yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint.yml
          file_or_dir: .
          strict: true
