name: ci - lint - files - *.go, *.sum
on:
  push:
    branches: [main]
    paths: ["**/*.go", "go.sum", ".golangci.yml"]
  pull_request:
    branches: [main]
    paths: ["**/*.go", "go.sum", ".golangci.yml"]
jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6
      - name: set up Go bootstrap
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: false
      - name: install gotip
        run: |
          go install golang.org/dl/gotip@latest
          "$(go env GOPATH)/bin/gotip" download
          GOTIP_ROOT=$("$(go env GOPATH)/bin/gotip" env GOROOT)
          echo "GOROOT=$GOTIP_ROOT" >> "$GITHUB_ENV"
          echo "$GOTIP_ROOT/bin" >> "$GITHUB_PATH"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-mode: goinstall
          args: --concurrency=1
  go-mod-verify:
    name: go mod verify
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6
      - name: set up Go bootstrap
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: install gotip
        run: |
          go install golang.org/dl/gotip@latest
          "$(go env GOPATH)/bin/gotip" download
          GOTIP_ROOT=$("$(go env GOPATH)/bin/gotip" env GOROOT)
          echo "GOROOT=$GOTIP_ROOT" >> "$GITHUB_ENV"
          echo "$GOTIP_ROOT/bin" >> "$GITHUB_PATH"
      - name: verify go.sum
        run: go mod verify
      - name: check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
