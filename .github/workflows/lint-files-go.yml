name: ci - lint - files - *.go, *.sum
on:
  push:
    branches: [main]
    paths: ["**/*.go", "go.sum", ".golangci.yml"]
  pull_request:
    branches: [main]
    paths: ["**/*.go", "go.sum", ".golangci.yml"]
jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6
      - name: set up Go bootstrap
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: false
      - name: weekly date for gotip cache
        id: weekly
        run: echo "date=$(date +%Y-W%V)" >> "$GITHUB_OUTPUT"
      - name: cache gotip SDK
        id: cache-gotip
        uses: actions/cache@v4
        with:
          path: ~/sdk/gotip
          key: gotip-${{ runner.os }}-${{ steps.weekly.outputs.date }}
          restore-keys: gotip-${{ runner.os }}-
      - name: install and build gotip
        run: |
          go install golang.org/dl/gotip@latest
          if [ "${{ steps.cache-gotip.outputs.cache-hit }}" != "true" ]; then
            "$(go env GOPATH)/bin/gotip" download
          fi
          GOTIP_ROOT=$("$(go env GOPATH)/bin/gotip" env GOROOT)
          echo "GOROOT=$GOTIP_ROOT" >> "$GITHUB_ENV"
          echo "$GOTIP_ROOT/bin" >> "$GITHUB_PATH"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-mode: goinstall
          # staticcheck and unparam are excluded here because they rely on golang.org/x/tools/go/ssa
          # which panics on Go 1.27 generic methods (typesinternal.ForEachElement + iter.go).
          # Re-enable once x/tools supports Go 1.27's type iterator API.
          args: --concurrency=1 --disable=staticcheck,unparam
  go-mod-verify:
    name: go mod verify
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6
      - name: set up Go bootstrap
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: weekly date for gotip cache
        id: weekly
        run: echo "date=$(date +%Y-W%V)" >> "$GITHUB_OUTPUT"
      - name: cache gotip SDK
        id: cache-gotip
        uses: actions/cache@v4
        with:
          path: ~/sdk/gotip
          key: gotip-${{ runner.os }}-${{ steps.weekly.outputs.date }}
          restore-keys: gotip-${{ runner.os }}-
      - name: install and build gotip
        run: |
          go install golang.org/dl/gotip@latest
          if [ "${{ steps.cache-gotip.outputs.cache-hit }}" != "true" ]; then
            "$(go env GOPATH)/bin/gotip" download
          fi
          GOTIP_ROOT=$("$(go env GOPATH)/bin/gotip" env GOROOT)
          echo "GOROOT=$GOTIP_ROOT" >> "$GITHUB_ENV"
          echo "$GOTIP_ROOT/bin" >> "$GITHUB_PATH"
      - name: verify go.sum
        run: go mod verify
      - name: check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
