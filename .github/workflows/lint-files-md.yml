name: ci - lint - files - *.md, *.rst
on:
  push:
    branches: [ main ]
    paths: [ "**/*.md", "**/*.rst", ".markdownlint.jsonc" ]
  pull_request:
    branches: [ main ]
    paths: [ "**/*.md", "**/*.rst", ".markdownlint.jsonc" ]
jobs:
  markdown-lint:
    name: markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: "**/*.md"
