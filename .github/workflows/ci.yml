name: ci - build + tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (gotip)
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6

      - name: set up Go bootstrap
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: weekly date for gotip cache
        id: weekly
        run: echo "date=$(date +%Y-W%V)" >> "$GITHUB_OUTPUT"

      - name: cache gotip SDK
        id: cache-gotip
        uses: actions/cache@v6
        with:
          path: ~/sdk/gotip
          key: gotip-${{ runner.os }}-${{ steps.weekly.outputs.date }}
          restore-keys: gotip-${{ runner.os }}-

      - name: install and build gotip
        run: |
          go install golang.org/dl/gotip@latest
          if [ "${{ steps.cache-gotip.outputs.cache-hit }}" != "true" ]; then
            "$(go env GOPATH)/bin/gotip" download
          fi
          GOTIP_ROOT=$("$(go env GOPATH)/bin/gotip" env GOROOT)
          echo "GOROOT=$GOTIP_ROOT" >> "$GITHUB_ENV"
          echo "$GOTIP_ROOT/bin" >> "$GITHUB_PATH"

      - name: download deps
        run: go mod download

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race -coverprofile=coverage.out ./...

      - name: coverage gate (>= 80%)
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          echo "Total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { if (t+0 < 80) { print "Coverage " t "% is below 80% threshold"; exit 1 } }'

      - name: upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6

      - name: set up Go bootstrap
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true

      - name: weekly date for gotip cache
        id: weekly
        run: echo "date=$(date +%Y-W%V)" >> "$GITHUB_OUTPUT"

      - name: cache gotip SDK
        id: cache-gotip
        uses: actions/cache@v6
        with:
          path: ~/sdk/gotip
          key: gotip-${{ runner.os }}-${{ steps.weekly.outputs.date }}
          restore-keys: gotip-${{ runner.os }}-

      - name: install and build gotip
        run: |
          go install golang.org/dl/gotip@latest
          if [ "${{ steps.cache-gotip.outputs.cache-hit }}" != "true" ]; then
            "$(go env GOPATH)/bin/gotip" download
          fi
          GOTIP_ROOT=$("$(go env GOPATH)/bin/gotip" env GOROOT)
          echo "GOROOT=$GOTIP_ROOT" >> "$GITHUB_ENV"
          echo "$GOTIP_ROOT/bin" >> "$GITHUB_PATH"

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: run govulncheck
        run: govulncheck ./...
